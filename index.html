<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0e1113" />
    <meta name="description" content="Your own workout app: plans, guided sessions and progress, stored on your device." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Banzir</title>
    <script>
      // Apply the saved appearance before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('banzir.settings') || '{}');
        var r = document.documentElement;
        r.dataset.theme = s.theme || 'midnight';
        if (s.accentHue != null) r.style.setProperty('--accent-h', s.accentHue);
        if (s.radius) r.dataset.radius = s.radius;
      } catch (e) {
        document.documentElement.dataset.theme = 'midnight';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
