name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Every flow at phone size, with providers and Open Food Facts mocked.
      - run: npm run e2e
      # Accessibility: axe on every screen, contrast of every theme and accent hue.
      - run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run a11y
          npm run contrast
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/output/
          retention-days: 7
